# Configuration ReadTheDocs (fichier lu par le service quand on importe le repo)
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

python:
  install:
    - requirements: docs/requirements.txt   # d'abord sphinx + pybind11 (pybind11 requis par setup.py)
    - method: pip
      path: .            # puis installe le package cum_mediane

sphinx:
  configuration: docs/conf.py
